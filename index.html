<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>American90 — 90 Days to Better English</title><meta name="description" content="A free 90-day American English learning program."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f7f9ff;--card:#fff;--ink:#16213b;--muted:#6d7890;--blue:#5865f2;--blue2:#7c83ff;--green:#21b66f;--yellow:#ffbf2f;--red:#ff6678;--line:#e7eaf4;--shadow:0 14px 40px rgba(31,45,85,.09);--radius:22px}*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f8f9ff,#eef4ff);min-height:100vh}button,input{font:inherit}button{border:0;cursor:pointer}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:26px 18px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}.logo{font-size:25px;font-weight:900;letter-spacing:-1px;padding:0 12px 25px}.logo span{color:var(--blue)}.nav button{width:100%;padding:13px 14px;margin:3px 0;border-radius:14px;background:transparent;color:#667087;text-align:left;font-weight:800}.nav button.active,.nav button:hover{background:#eef0ff;color:var(--blue)}.sidebottom{margin-top:auto;background:#f6f7ff;border-radius:18px;padding:16px;font-size:13px;color:var(--muted)}.main{padding:30px;max-width:1250px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.hello{font-size:30px;font-weight:900;letter-spacing:-1px}.sub{color:var(--muted);margin-top:3px}.actions{display:flex;gap:10px;align-items:center}.pill{padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;font-weight:900}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e9ebff;color:var(--blue);font-weight:900}.hero{background:linear-gradient(135deg,#5865f2,#7c83ff);color:#fff;border-radius:28px;padding:30px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:25px;overflow:hidden}.hero h1{margin:0;font-size:35px;line-height:1.05}.hero p{opacity:.88;max-width:620px}.cta{background:#fff;color:var(--blue);padding:13px 19px;border-radius:14px;font-weight:900;margin-top:8px}.hero .orb{width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.13);box-shadow:0 0 0 28px rgba(255,255,255,.06);flex:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:0 7px 25px rgba(31,45,85,.045)}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:13px;font-weight:700}.section{margin-top:22px}.section h2{font-size:21px;margin:0 0 13px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.day{padding:16px;border:1px solid var(--line);background:#fff;border-radius:18px;min-height:118px;position:relative}.day.locked{opacity:.55}.day.done{border-color:#bfe9d4;background:#f5fffa}.day .n{font-size:12px;color:var(--muted);font-weight:900}.day h3{font-size:16px;margin:7px 0}.bar{height:7px;border-radius:99px;background:#edf0f7;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#8b91ff);border-radius:99px}.lesson{display:grid;grid-template-columns:1fr 360px;gap:18px}.lesson-main{background:#fff;border:1px solid var(--line);border-radius:25px;padding:26px}.lesson-side{display:flex;flex-direction:column;gap:14px}.word{font-size:42px;font-weight:900;letter-spacing:-1px}.pron{color:var(--blue);font-weight:800}.meaning{font-size:20px;margin:10px 0 20px}.example{padding:17px;border-radius:16px;background:#f7f8ff;color:#46506b}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.choice{padding:15px;border:2px solid var(--line);border-radius:15px;background:#fff;text-align:left;font-weight:800}.choice:hover{border-color:var(--blue)}.choice.correct{border-color:var(--green);background:#effcf5}.choice.wrong{border-color:var(--red);background:#fff2f4}.primary{background:var(--blue);color:#fff;padding:13px 18px;border-radius:14px;font-weight:900}.ghost{background:#f1f3fb;color:var(--ink);padding:13px 18px;border-radius:14px;font-weight:900}.profilegrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.achievement{display:flex;gap:13px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:17px;margin:9px 0}.badge{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:#fff4ce;font-size:22px}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:var(--shadow)}.authbox h1{font-size:31px;margin:0}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;outline:none}.field input:focus{border-color:var(--blue)}.tiny{font-size:12px;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;background:#18233d;color:#fff;padding:14px 17px;border-radius:15px;box-shadow:var(--shadow);font-weight:800}.mobile{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;position:fixed;bottom:10px;left:10px;right:10px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px;box-shadow:var(--shadow);justify-content:space-around}.mobile button{background:none;padding:10px}.main{padding:18px 15px 95px}.stats{grid-template-columns:1fr 1fr}.days{grid-template-columns:1fr 1fr}.lesson{grid-template-columns:1fr}.hero .orb{display:none}.hero h1{font-size:28px}.profilegrid{grid-template-columns:1fr}.top{align-items:flex-start}.hello{font-size:24px}}
</style></head><body><div id="root"></div><script>
const SUPABASE_URL='YOUR_SUPABASE_URL';const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';let sb=null;if(!SUPABASE_URL.startsWith('YOUR_')) sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const curriculum=[['Getting Started','Greetings & introductions'],['Everyday Basics','Family, school & routines'],['Food & Drinks','Ordering and preferences'],['Around Town','Directions & places'],['People & Personality','Describing people'],['Time & Plans','Schedules & future'],['Home & Life','Rooms, chores & habits'],['School & Work','Useful American phrases'],['Travel','Airport, hotel & transport'],['Health','Body, feelings & simple needs'],['Shopping','Prices, sizes & returns'],['Hobbies','Free time & interests'],['Past Stories','Past simple essentials'],['Future Goals','Plans & intentions'],['Communication','Questions & conversation'],['American English','Common US vocabulary'],['Listening Boost','Everyday spoken English'],['Grammar Builder','Core sentence patterns'],['Real Conversations','Small talk & opinions'],['Confidence','Speaking without freezing'],['Review Week 1','Mixed review'],['Review Week 2','Mixed review'],['Review Week 3','Mixed review'],['Review Week 4','Mixed review'],['Checkpoint A1','Progress checkpoint'],['A2 Foundations','Longer sentences'],['A2 Daily Life','Natural routines'],['A2 Social English','Invitations & replies'],['A2 Stories','Narrating events'],['A2 Listening','Fast everyday speech'],['A2 Review','Checkpoint'],['B1 Foundations','Opinions & reasons'],['B1 School','Explaining ideas'],['B1 Work','Professional basics'],['B1 Travel','Solving problems'],['B1 Media','News & entertainment'],['B1 Conversation','Keeping a conversation'],['B1 Grammar','Tenses in context'],['B1 Listening','Connected speech'],['B1 Review','Checkpoint'],['Vocabulary Power','High-frequency words'],['Phrasal Verbs','Common American phrasal verbs'],['Pronunciation','US sounds & stress'],['Speaking Lab','Answering quickly'],['Listening Lab','Real-world audio skills'],['Writing','Messages & short paragraphs'],['Reading','Short authentic texts'],['Grammar Mix','Accuracy practice'],['Conversation','Questions + follow-ups'],['Review','Checkpoint'],['American Culture','Everyday US context'],['Slang & Informal','When Americans speak casually'],['Work & Career','Interviews & teamwork'],['School & College','Classroom English'],['Travel Problems','Fixing issues politely'],['Opinions','Agreeing & disagreeing'],['Stories','Detailed past events'],['Future','Predictions & plans'],['Conditionals','If-clauses made easy'],['Review','Checkpoint'],['Fluency Sprint','Fast recall'],['Vocabulary Sprint','Active vocabulary'],['Listening Sprint','Main idea + details'],['Speaking Sprint','60-second answers'],['Grammar Sprint','Accuracy'],['Reading Sprint','Context clues'],['Writing Sprint','Natural messages'],['Conversation Sprint','Back-and-forth'],['Review','Checkpoint'],['B1+ Vocabulary','More precise words'],['B1+ Phrasal Verbs','Natural combinations'],['B1+ Pronunciation','Rhythm & reductions'],['B1+ Listening','Different speakers'],['B1+ Speaking','Explain and defend'],['B1+ Writing','Structured paragraphs'],['B1+ Reading','Longer texts'],['B1+ Grammar','Nuance'],['B1+ Review','Checkpoint'],['Final Prep','Mixed skills'],['Final Listening','Understand the gist'],['Final Speaking','2-minute response'],['Final Reading','Authentic text'],['Final Writing','Structured response'],['Final Grammar','Mixed checkpoint'],['Final Vocabulary','Recall challenge'],['Final Conversation','Real-life scenarios'],['Final Review','Full mock test'],['Day 90 — Graduation','Final 90-day assessment']];
const words=[['awesome','отличный, крутой'],['schedule','расписание'],['actually','на самом деле'],['hang out','проводить время'],['figure out','разобраться'],['grab','взять/захватить'],['pretty','довольно, весьма'],['stuff','вещи, всякое'],['gonna','собираюсь (разговорное)'],['kinda','вроде, типа (разговорное)'],['favorite','любимый'],['vacation','отпуск, каникулы'],['apartment','квартира'],['cell phone','мобильный телефон'],['gas station','заправка'],['sidewalk','тротуар'],['elevator','лифт'],['cookie','печенье'],['fries','картошка фри'],['candy','конфеты'],['movie','фильм'],['soccer','футбол'],['line','очередь'],['store','магазин'],['trash','мусор'],['fall','осень'],['college','колледж'],['grade','оценка/класс'],['zip code','почтовый индекс'],['check','счёт в ресторане']];
let state={user:null,view:'home',day:1,xp:0,streak:0,completed:[],review:[],correct:0,total:0};
function load(){try{let x=JSON.parse(localStorage.getItem('american90'));if(x)state={...state,...x}}catch(e){} if(sb) sb.auth.getSession().then(({data})=>{if(data.session){state.user=data.session.user;render()}})}
function save(){localStorage.setItem('american90',JSON.stringify({...state,user:state.user?{email:state.user.email,id:state.user.id}:null}))}
function go(v){state.view=v;render();window.scrollTo(0,0)}
function render(){if(!state.user)return auth();document.getElementById('root').innerHTML=`<div class="app"><aside class="side"><div class="logo">American<span>90</span></div><nav class="nav"><button class="${state.view==='home'?'active':''}" onclick="go('home')">🏠 Learn</button><button class="${state.view==='lesson'?'active':''}" onclick="go('lesson')">📚 Lesson</button><button class="${state.view==='review'?'active':''}" onclick="go('review')">🔁 Review</button><button class="${state.view==='achievements'?'active':''}" onclick="go('achievements')">🏆 Achievements</button><button class="${state.view==='profile'?'active':''}" onclick="go('profile')">👤 Profile</button></nav><div class="sidebottom"><b>🇺🇸 American English</b><br>90-day free path<br><br>Built for daily progress, not cramming.</div></aside><main class="main">${state.view==='home'?home():state.view==='lesson'?lesson():state.view==='review'?review():state.view==='achievements'?achievements():profile()}</main><nav class="mobile"><button onclick="go('home')">🏠</button><button onclick="go('lesson')">📚</button><button onclick="go('review')">🔁</button><button onclick="go('achievements')">🏆</button><button onclick="go('profile')">👤</button></nav></div>`}
function top(){return `<div class="top"><div><div class="hello">Hey, ${state.user.email.split('@')[0]} 👋</div><div class="sub">Your next step is small. Your 90-day result is not.</div></div><div class="actions"><span class="pill">🔥 ${state.streak} day streak</span><div class="avatar">${state.user.email[0].toUpperCase()}</div></div></div>`}
function home(){let pct=Math.round(state.completed.length/90*100),start=Math.max(0,state.day-3),days=Array.from({length:10},(_,i)=>start+i+1).filter(n=>n<=90);return top()+`<section class="hero"><div><h1>90 days.<br>Real American English.</h1><p>Daily vocabulary, listening, grammar, speaking and spaced review — designed as one connected path from beginner foundations toward confident everyday communication.</p><button class="cta" onclick="go('lesson')">Continue Day ${state.day} →</button></div><div class="orb"></div></section><div class="stats"><div class="stat"><b>${state.xp}</b><span>XP earned</span></div><div class="stat"><b>${state.completed.length}/90</b><span>days completed</span></div><div class="stat"><b>${state.correct}/${state.total||0}</b><span>quiz answers</span></div><div class="stat"><b>${pct}%</b><span>90-day path</span></div></div><section class="section"><h2>Your path</h2><div class="days">${days.map(n=>dayCard(n)).join('')}</div></section><section class="section"><h2>What you'll train</h2><div class="profilegrid"><div class="card"><b>🗣 Speaking</b><p class="sub">Useful phrases, quick responses, mini speaking prompts and conversation patterns.</p></div><div class="card"><b>🎧 Listening</b><p class="sub">American vocabulary, reductions, connected speech and comprehension checks.</p></div><div class="card"><b>🧠 Memory</b><p class="sub">Spaced review brings older words back before they disappear.</p></div><div class="card"><b>✍️ Grammar + writing</b><p class="sub">Short explanations followed by active practice instead of long theory blocks.</p></div></div></section>`}
function dayCard(n){let done=state.completed.includes(n),locked=n>state.day;return `<button class="day ${done?'done':''} ${locked?'locked':''}" ${locked?'disabled':''} onclick="state.day=${n};go('lesson')"><div class="n">DAY ${n}</div><h3>${curriculum[n-1]?.[0]||'Review'}</h3><div class="sub">${curriculum[n-1]?.[1]||''}</div><div class="bar" style="margin-top:12px"><i style="width:${done?100:n===state.day?45:0}%"></i></div></button>`}
function lesson(){let w=words[(state.day-1)%words.length], options=[w[1],'быстрый','завтра','встреча'];let idx=0;return top()+`<div class="lesson"><div class="lesson-main"><div class="tiny">DAY ${state.day} · ${curriculum[state.day-1]?.[0]}</div><h1>${curriculum[state.day-1]?.[1]}</h1><p class="sub">Mini lesson • vocabulary • American usage • quick check</p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><div class="word">${w[0]}</div><div class="pron">American English • active vocabulary</div><div class="meaning">${w[1]}</div><div class="example">“I need to ${w[0] === 'figure out'?'figure out what time the movie starts':'learn this word and use it in a real sentence'}.”</div><h3>Quick check</h3><p>What does <b>${w[0]}</b> mean?</p><div class="choices">${options.map((o,i)=>`<button class="choice" onclick="answer(this,${i===idx})">${o}</button>`).join('')}</div><div id="feedback" style="margin-top:15px"></div></div><aside class="lesson-side"><div class="card"><b>🎯 Today</b><p class="sub">1 vocabulary block<br>1 grammar pattern<br>1 listening/speaking prompt<br>1 review check</p></div><div class="card"><b>🇺🇸 US English note</b><p class="sub">American English commonly uses words like <b>apartment</b>, <b>vacation</b>, <b>soccer</b> and <b>fall</b>. You'll meet them repeatedly.</p></div><div class="card"><b>🔥 Streak rule</b><p class="sub">Complete one learning activity each day to keep your streak alive.</p></div></aside></div>`}
function answer(el,correct){if(document.querySelector('#feedback').dataset.done)return;state.total++;if(correct){state.correct++;state.xp+=10;el.classList.add('correct');document.querySelector('#feedback').innerHTML='<b style="color:var(--green)">Correct! +10 XP</b>'}else{el.classList.add('wrong');document.querySelector('#feedback').innerHTML='<b style="color:var(--red)">Not quite — review it and try again.</b>'}document.querySelector('#feedback').dataset.done='1';setTimeout(()=>{if(correct)finishDay()},700);save()}
function finishDay(){if(!state.completed.includes(state.day)){state.completed.push(state.day);state.xp+=40;state.streak++;if(state.day<90)state.day++;save();toast('Day complete! +40 XP 🎉')}go(state.day===91?'achievements':'home')}
function review(){let w=words[(state.correct+state.day)%words.length];return top()+`<div class="card"><div class="tiny">SPACED REVIEW</div><h1>Bring old words back.</h1><p class="sub">Review is deliberately mixed with new learning. Try to recall the meaning before revealing it.</p><div class="word" style="margin-top:28px">${w[0]}</div><div id="reveal" class="hidden"><div class="meaning">${w[1]}</div><div class="example">Use it in a sentence about your own life.</div></div><button class="primary" onclick="document.getElementById('reveal').classList.remove('hidden');this.classList.add('hidden')">Reveal meaning</button></div>`}
function achievements(){let a=[['🌱','First Step','Complete your first day.',state.completed.length>=1],['🔥','On Fire','Keep a 7-day streak.',state.streak>=7],['📚','Week One','Complete 7 days.',state.completed.length>=7],['🧠','Memory Builder','Answer 25 quiz questions.',state.total>=25],['⚡','XP 500','Earn 500 XP.',state.xp>=500],['🏆','Halfway','Complete 45 days.',state.completed.length>=45],['🇺🇸','American English','Complete 60 days.',state.completed.length>=60],['🎓','Graduate','Complete all 90 days.',state.completed.length>=90]];return top()+`<div class="card"><h1>Achievements</h1><p class="sub">Small milestones make a long course feel playable.</p>${a.map(x=>`<div class="achievement" style="opacity:${x[3]?1:.45}"><div class="badge">${x[0]}</div><div><b>${x[1]}</b><div class="sub">${x[2]}</div></div></div>`).join('')}</div>`}
function profile(){return top()+`<div class="profilegrid"><div class="card"><h1>Your profile</h1><p class="sub">${state.user.email}</p><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><b>Goal</b><p class="sub">Confident everyday American English</p><b>Path</b><p class="sub">90 days · daily practice · active recall</p><button class="ghost" onclick="logout()">Sign out</button></div><div class="card"><h2>Progress</h2><p><b>${state.completed.length}</b> days completed</p><div class="bar"><i style="width:${state.completed.length/90*100}%"></i></div><p><b>${state.xp}</b> XP</p><p><b>${state.correct}</b> correct answers</p></div></div>`}
function auth(){document.getElementById('root').innerHTML=`<div class="auth"><div class="authbox"><div class="logo" style="padding:0 0 20px">American<span>90</span></div><h1>Learn American English for free.</h1><p class="sub">A structured 90-day path with progress, streaks, review and mini tests.</p><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="pass" type="password" placeholder="At least 6 characters"></div><button class="primary" style="width:100%" onclick="signup()">Create free account</button><button class="ghost" style="width:100%;margin-top:9px" onclick="signin()">Sign in</button><p class="tiny" style="margin-top:16px">Demo mode works locally. For real multi-user accounts, connect the included Supabase setup.</p></div></div>`}
async function signup(){let e=email.value,p=pass.value;if(!e||p.length<6)return toast('Enter an email and 6+ character password.');if(sb){let {data,error}=await sb.auth.signUp({email:e,password:p});if(error)return toast(error.message);state.user=data.user;save();render()}else{state.user={email:e,id:'local'};save();render()}toast('Welcome to American90!')}
async function signin(){let e=email.value,p=pass.value;if(sb){let {data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)return toast(error.message);state.user=data.user;save();render()}else{state.user={email:e,id:'local'};save();render()} }
async function logout(){if(sb)await sb.auth.signOut();state.user=null;save();render()}
function toast(s){let x=document.createElement('div');x.className='toast';x.textContent=s;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}load();render();
</script></body></html>
